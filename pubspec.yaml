name: laundry_management_system
description: "Laundry Management System - Aplikasi POS & manajemen laundry profesional."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Networking
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3

  # Routing
  go_router: ^14.2.0

  # Model & Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  fluttertoast: ^8.2.5

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1

  # Bluetooth Thermal Printer
  esc_pos_utils_plus: ^2.0.4
  print_bluetooth_thermal: ^1.1.4
  permission_handler: ^11.4.0

  # Utils
  intl: ^0.19.0
  logger: ^2.3.0
  equatable: ^2.0.5
  uuid: ^4.4.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code Generators untuk Freezed & JSON:
  build_runner: ^2.5.4
  freezed: ^2.5.8
  json_serializable: ^6.9.5

  # Dimatikan sementara agar tidak memicu konflik analyzer:
  # riverpod_generator: ^2.4.0
  # custom_lint: ^0.7.3
  # riverpod_lint: ^2.6.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/